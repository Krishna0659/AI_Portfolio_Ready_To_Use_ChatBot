name: portfolioai-cloud
x-service-defaults: &defaults
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  security_opt: ["no-new-privileges:true"]
services:
  database:
    <<: *defaults
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: database.env
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_admin -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 30
  chroma:
    <<: *defaults
    image: chromadb/chroma:1.4.1@sha256:ded4839c74b589de70c98ad5722df3be49fcc0a1e4d8120e046b5a139ffa67ac
    restart: unless-stopped
    volumes: ["chroma:/data"]
    networks: [private]
    mem_limit: 2g
  knowledge:
    <<: *defaults
    build: ../services/knowledge-base
    restart: unless-stopped
    env_file: knowledge.env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      KB_DATA_DIR: /data
      KB_CHROMA_DATA_DIR: /chroma-storage
    volumes: ["knowledge:/data", "chroma:/chroma-storage:ro"]
    networks: [private]
    mem_limit: 2g
    depends_on: [chroma]
  web:
    <<: *defaults
    image: portfolioai-web:pilot
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    env_file: application.env
    volumes: ["objects:/app/.local/objects"]
    networks: [private, public]
    depends_on:
      database: {condition: service_healthy}
    mem_limit: 1500m
  worker:
    <<: *defaults
    image: portfolioai-web:pilot
    restart: unless-stopped
    command: ["node", "node_modules/tsx/dist/cli.mjs", "apps/worker/index.ts"]
    env_file: application.env
    volumes: ["objects:/app/.local/objects"]
    networks: [private, public]
    depends_on:
      database: {condition: service_healthy}
    mem_limit: 1000m
  proxy:
    <<: *defaults
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data", "caddy-config:/config"]
    networks: [public]
    depends_on: [web]
networks:
  private: {internal: true}
  public: {}
volumes:
  database: {}
  chroma: {}
  knowledge: {}
  objects: {}
  caddy: {}
  caddy-config: {}
