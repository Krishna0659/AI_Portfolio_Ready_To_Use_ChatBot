name: portfolioai-foundation-test
services:
  database:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: portfolio_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  checks:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./.local/foundation-test/environment:/app/.env.local:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
secrets:
  database_password:
    file: ./.local/foundation-test/database-password
