name: portfolioai-kb

services:
  chroma:
    image: chromadb/chroma:1.4.1
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    expose:
      - "8000"
    volumes:
      - chroma-data:/data
    networks: [private]

  knowledge-base:
    build: .
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      KB_API_KEY: ${KB_API_KEY:?set KB_API_KEY in .env}
      KB_DATA_DIR: /data
      KB_CHROMA_DATA_DIR: /chroma-storage
      KB_CALLER_GRANTS: ${KB_CALLER_GRANTS:-{}}
    depends_on:
      chroma:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - kb-data:/data
      - chroma-data:/chroma-storage:ro
      - model-cache:/models
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8080/health/ready',headers={'x-kb-api-key':os.environ['KB_API_KEY']}),timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 6

networks:
  private:
    internal: true

volumes:
  chroma-data:
  kb-data:
  model-cache:
